[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

# If either process dies the container should die too, so Cloud Run replaces
# the whole instance rather than serving traffic from a half-dead container.
[eventlistener:process_exit]
command=sh -c "printf 'READY\n'; while read line; do echo 'A child process exited — stopping container' >&2; kill -SIGQUIT $PPID; done"
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
autostart=true
autorestart=false

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
autostart=true
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=nginx -c /etc/nginx/nginx.conf
autostart=true
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

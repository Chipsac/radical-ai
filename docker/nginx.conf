daemon off;
user www-data;
worker_processes auto;
pid /run/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Cloud Run captures stdout/stderr as structured logs.
    access_log /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Cloud Run's proxy already gzips, but this covers direct hits.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 12M;   # payslip PDFs

    server {
        # PORT is substituted by the entrypoint before nginx starts.
        listen ${PORT} default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Long-lived caching for fingerprinted Vite assets.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_hide_header X-Powered-By;

            # Cloud Run allows requests up to 60 minutes; keep FPM in step
            # with the request timeout configured on the service.
            fastcgi_read_timeout 300;
        }

        # Never serve dotfiles (.env, .git) even if one ends up in the image.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}

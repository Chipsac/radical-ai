[www]
; Cloud Run gives each instance a small, fixed CPU allocation and handles
; horizontal scaling itself, so a modest static pool beats a dynamic one:
; no fork latency on a cold start, and predictable memory use.
pm = static
pm.max_children = 8
pm.max_requests = 500

listen = 127.0.0.1:9000

; Surface worker output in Cloud Logging.
catch_workers_output = yes
decorate_workers_output = no

access.log = /dev/null
php_admin_flag[log_errors] = on

clear_env = no
